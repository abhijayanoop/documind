name: EvalKit Quality Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:  

jobs:
  eval:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: documind
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: documind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U documind"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://documind:localdev@localhost:5432/documind
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LLM_MODEL: gpt-4o-mini
      JWT_SECRET: ci-not-a-real-secret

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run migrations, seed, backfill
        run: |
          uv run python -m documind.migrate
          uv run python scripts/seed.py
          uv run python scripts/backfill.py

      - name: Restore baseline
        run: |
          mkdir -p eval_runs
          cp ci/baseline.json eval_runs/baseline.json

      - name: Run EvalKit (fails on regression via exit code)
        id: eval
        run: uv run python -m evalkit.cli

      - name: Upload report artifact
        if: always()          
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            eval_report.md
            eval_report.json
